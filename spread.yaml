project: valkey-snap

backends:
  craft:
    type: craft
    systems:
      - ubuntu-26.04

suites:
  spread/tests/:
    summary: General integration tests
    prepare: |
      apt --purge remove valkey*
    prepare-each: |
      snap install "$CRAFT_ARTIFACT" --dangerous
      snap start valkey.server
      retry=0
      until valkey.cli ping 2>/dev/null | grep -q PONG; do
        retry=$((retry + 1))
        if [ $retry -ge 30 ]; then
          echo "Valkey server did not become ready in time"
          snap logs valkey.server || true
          exit 1
        fi
        sleep 1
      done
    restore-each: |
      snap remove valkey --purge --terminate

exclude:
  - .git

kill-timeout: 1h
