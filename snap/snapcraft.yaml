name: valkey
base: core26
version: "9.1.0"
summary: "Valkey: open source, in memory datastore as a snap" # 79 char long summary
description: |
  A flexible distributed key-value database that is optimized 
  for caching and other realtime workloads. Valkey is an open 
  source, in memory datastore released under the BSD-3 Clause License.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
platforms:
  amd64:
  arm64:

system-usernames:
  snap_daemon: shared

apps:
  server:
    command: start_valkey.sh
    daemon: simple
    restart-condition: always
    restart-delay: 20s
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  cli:
    command: usr/bin/valkey-cli
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  benchmark:
    command: usr/bin/valkey-benchmark
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  check-aof:
    command: usr/bin/valkey-check-aof
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  check-rdb:
    command: usr/bin/valkey-check-rdb
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  sentinel:
    command: start_sentinel.sh
    daemon: simple
    restart-condition: always
    restart-delay: 20s
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind
      - network-observe
      - home

parts:
  valkey:
    plugin: dump
    source: bld:valkey
    source-channel: 9.1-26.04/edge
    stage-packages:
      - util-linux

  local-files:
    plugin: dump
    source: snap/local/
